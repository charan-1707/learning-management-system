spring.application.name=learnhub-lms

# --- MySQL (local development) ---
# Credentials are read from environment variables, falling back to the local
# development database/user created during setup. LMS_-prefixed names avoid
# colliding with unrelated DB_* variables that may exist on the machine.
spring.datasource.url=${LMS_DB_URL:jdbc:mysql://localhost:3306/learnhub?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8}
spring.datasource.username=${LMS_DB_USERNAME:learnhub}
spring.datasource.password=${LMS_DB_PASSWORD:learnhub}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# 'update' is chosen for this development phase so tables are created/kept
# in sync without dropping existing data on restart. Switching to Flyway or
# 'validate' is the responsibility of a later phase.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Jackson ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# --- JWT (authentication) ---
# HS256 signing key. Must be >= 32 bytes. Override via LMS_JWT_SECRET in prod.
# Token lifetime in milliseconds (default 24h).
app.jwt.secret=${LMS_JWT_SECRET:lms-dev-secret-change-me-32-bytes-minimum!}
app.jwt.expiration-ms=${LMS_JWT_EXPIRATION_MS:86400000}

server.port=8080