# Test configuration: repository tests and the Spring context smoke test run
# against an in-memory H2 database (MySQL mode) -- the real MySQL database is
# never touched by tests.
spring.datasource.url=jdbc:h2:mem:learnhub;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,PASSWORD,VALUE,YEAR,KEY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT defaults reused by the auth integration test (same defaults as main config).
app.jwt.secret=lms-dev-secret-change-me-32-bytes-minimum!
app.jwt.expiration-ms=86400000