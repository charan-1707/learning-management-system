server:
  # PaaS hosts (Render/Railway/Heroku/...) inject PORT; default keeps local dev on 8080.
  port: ${PORT:8080}

spring:
  datasource:
    # Split-hosting override: set APP_DB_URL to the managed database JDBC URL
    # (plus DB_USERNAME/DB_PASSWORD). App-scoped name on purpose: a bare
    # DB_URL is a common convention other projects/tools also set, which
    # would silently hijack this datasource. Defaults keep local MySQL working.
    url: ${APP_DB_URL:jdbc:mysql://localhost:3306/learnhub?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    # Dev/test get schema + demo seeds; the prod profile overrides this to
    # schema-only so production ships clean (see seed-data policy in README).
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  mail:
    properties:
      mail:
        smtp:
          # Fail fast (5s) if SMTP egress is blocked, instead of hanging
          # request threads for minutes before falling back to the log.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-64-char-min-change-me-64-char-min-0123456789abcdef}
    # Short access TTL + rotating refresh tokens (silent refresh in frontend).
    access-minutes: 15
    refresh-days: 7
  cors:
    # Extra origins (comma-separated) merged with the localhost/LAN dev
    # defaults in CorsConfig. PROD (separate frontend host): set
    # APP_CORS_ALLOWED_ORIGINS to the frontend origin(s),
    # e.g. "https://learnhub.example.com".
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:}
  uploads-dir: ./uploads
  # Wipe (/api/admin/wipe) deletes every user EXCEPT this one, so access
  # is never lost. Also the first-start bootstrap when users is empty.
  primary-admin-email: ${APP_PRIMARY_ADMIN_EMAIL:learnhub.edu.in@gmail.com}
  # First-start admin when the users table is empty (fresh database).
  bootstrap-admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:admin@learnhub.local}
  bootstrap-admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:admin123}
  bootstrap-admin-name: ${APP_BOOTSTRAP_ADMIN_NAME:System Administrator}
  # Outgoing mail: HTTPS via Brevo (APP_BREVO_API_KEY) is the production path —
  # hosts like Render blackhole outbound SMTP, so Gmail SMTP hangs and can
  # never deliver there. Legacy SMTP (SPRING_MAIL_HOST/...) still works
  # wherever egress allows it. With neither, links/codes are only logged.
  brevo-api-key: ${APP_BREVO_API_KEY:}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:8000}
  mail-from: ${APP_MAIL_FROM:no-reply@learnhub.local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # The mail health check dials SMTP on every /actuator/health call; on
      # hosts with blocked SMTP egress that hangs the health endpoint for
      # minutes and fails deploys. Mail delivery is covered by app-level
      # logging instead.
      enabled: false
