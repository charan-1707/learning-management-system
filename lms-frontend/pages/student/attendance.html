<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="student" data-page="student-attendance" data-title="Attendance">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">

    <div class="page-header">
      <div class="page-title-section"><h1>Attendance</h1><p>Track your presence across courses this semester.</p></div>
    </div>

    <div class="grid grid-cols-3" id="attendance-summary" style="gap:var(--spacing-6);margin-bottom:var(--spacing-6);"></div>

    <div class="dash-col">
      <section class="card">
        <div class="card-header"><h2 class="card-title">Course-wise attendance</h2><p class="card-subtitle">Percentage of classes attended</p></div>
        <div class="card-body" id="attendance-courses"></div>
      </section>

      <section class="card">
        <div class="card-header"><h2 class="card-title">Recent history</h2><p class="card-subtitle">Your latest attendance records</p></div>
        <div class="card-body" style="padding-top:var(--spacing-4);padding-bottom:var(--spacing-4);" id="attendance-history"></div>
      </section>
    </div>

  </main>
  <script src="../../js/pages/student/attendance.js"></script>
</body>
</html>
