<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Courses - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="student" data-page="student-courses" data-title="My Courses">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">

    <div class="page-header">
      <div class="page-title-section">
        <h1>My courses</h1>
        <p>All courses you are enrolled in this semester.</p>
      </div>
      <div class="page-actions">
        <a class="btn btn-secondary" href="#">Suggest a course</a>
      </div>
    </div>

    <div class="card" style="padding:var(--spacing-5);margin-bottom:var(--spacing-6);">
      <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
        <div style="position:relative;flex:1;min-width:220px;">
          <span style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--color-text-muted);display:flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
          <input type="search" class="form-input" id="course-search" placeholder="Search your courses..." aria-label="Search courses" style="padding-left:40px;">
        </div>
        <div style="position:relative;">
          <select class="form-input form-select" id="course-category" aria-label="Filter by category" style="height:44px;">
            <option value="all">All categories</option>
            <option value="Programming">Programming</option>
            <option value="Data">Data</option>
            <option value="Systems">Systems</option>
            <option value="Artificial Intelligence">Artificial Intelligence</option>
          </select>
        </div>
        <div style="position:relative;">
          <select class="form-input form-select" id="course-filter" aria-label="Filter courses" style="height:44px;">
            <option value="all">All courses</option>
            <option value="in-progress">In progress</option>
            <option value="completed">Completed</option>
            <option value="critical">Needs attention</option>
          </select>
        </div>
        <span class="text-sm text-tertiary" id="course-count"></span>
      </div>
    </div>

    <div id="course-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:var(--spacing-6);"></div>

  </main>
  <script src="../../js/pages/student/courses.js"></script>
</body>
</html>
