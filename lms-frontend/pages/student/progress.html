<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Progress - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="student" data-page="student-progress" data-title="Progress">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">

    <div class="page-header">
      <div class="page-title-section"><h1>Progress</h1><p>Course completion and performance analytics.</p></div>
    </div>

    <div class="grid grid-cols-4" id="progress-summary" style="gap:var(--spacing-6);margin-bottom:var(--spacing-6);"></div>

    <div class="dash-col">
      <section class="card">
        <div class="card-header"><h2 class="card-title">Course completion</h2><p class="card-subtitle">Modules completed per course</p></div>
        <div class="card-body" id="progress-courses"></div>
      </section>

      <div class="stack">
        <section class="card">
          <div class="card-header"><h2 class="card-title">Assessment performance</h2></div>
          <div class="card-body" id="progress-grades"></div>
        </section>
        <section class="card">
          <div class="card-header"><h2 class="card-title">Activity this week</h2></div>
          <div class="card-body" id="progress-week"></div>
        </section>
      </div>
    </div>

  </main>
  <script src="../../js/pages/student/progress.js"></script>
</body>
</html>
