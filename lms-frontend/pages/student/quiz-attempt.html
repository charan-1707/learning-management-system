<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="student" data-page="student-quiz-attempt" data-title="Quiz">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">

    <div class="card" style="margin-bottom:var(--spacing-6);">
      <div class="card-body" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
        <div>
          <div class="flex items-center" style="gap:10px;margin-bottom:4px;flex-wrap:wrap;">
            <h1 style="font-size:20px;font-weight:700;color:var(--color-text-primary);" id="quiz-title"></h1>
            <span id="quiz-course"></span>
          </div>
          <p style="font-size:13px;color:var(--color-text-tertiary);" id="quiz-meta"></p>
        </div>
        <div class="quiz-timer" id="quiz-timer" aria-live="polite">
          <span style="display:flex;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></span>
          <span id="timer-text">00:00</span>
        </div>
      </div>
    </div>

    <div class="dash-col" style="grid-template-columns:1fr 320px;">
      <div class="card">
        <div class="card-body">
          <div id="question-area"></div>
          <div class="quiz-navigation">
            <button class="btn btn-secondary" id="prev-question"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg> Previous</button>
            <button class="btn btn-primary" id="next-question">Next <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg></button>
          </div>
        </div>
      </div>

      <div class="stack">
        <section class="card">
          <div class="card-header"><h2 class="card-title">Question navigation</h2></div>
          <div class="card-body">
            <div class="quiz-question-nav" id="question-nav"></div>
            <div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;color:var(--color-text-tertiary);">
              <span><span class="quiz-nav-dot" style="display:inline-flex;width:14px;height:14px;margin-right:6px;">1</span> Answered</span>
              <span><span class="quiz-nav-dot active" style="display:inline-flex;width:14px;height:14px;margin-right:6px;">1</span> Current</span>
            </div>
          </div>
        </section>
        <section class="card">
          <div class="card-header"><h2 class="card-title">Submit quiz</h2></div>
          <div class="card-body">
            <p style="font-size:13px;color:var(--color-text-tertiary);margin-bottom:16px;">Answered <span id="answered-count" style="font-weight:600;color:var(--color-text-primary);">0</span> of <span id="total-count">0</span> questions. You can review before submitting.</p>
            <button class="btn btn-primary" style="width:100%;" id="submit-quiz"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg> Submit quiz</button>
          </div>
        </section>
      </div>
    </div>

  </main>
  <script src="../../js/pages/student/quiz-attempt.js"></script>
</body>
</html>
