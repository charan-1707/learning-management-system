<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quizzes - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="student" data-page="student-quizzes" data-title="Quizzes">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">
    <div class="page-header">
      <div class="page-title-section">
        <h1>Quizzes</h1>
        <p>Upcoming and attempted quizzes across your courses.</p>
      </div>
    </div>
    <div class="dash-col two-two">
      <section class="card">
        <div class="card-header"><h2 class="card-title">Available quizzes</h2></div>
        <div class="card-body" style="padding-top:var(--spacing-4);padding-bottom:var(--spacing-4);" id="available-quizzes"></div>
      </section>
      <section class="card">
        <div class="card-header"><h2 class="card-title">Previous attempts</h2><p class="card-subtitle">Completed quizzes and your best scores</p></div>
        <div class="card-body" style="padding-top:var(--spacing-4);padding-bottom:var(--spacing-4);" id="attempted-quizzes"></div>
      </section>
    </div>
  </main>
  <script src="../../js/pages/student/quizzes.js"></script>
</body>
</html>
