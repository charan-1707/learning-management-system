<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Students - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="admin" data-page="admin-students" data-title="Students">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">

    <div class="page-header">
      <div class="page-title-section"><h1>Students</h1><p>Manage student accounts and enrollment.</p></div>
      <div class="page-actions"><button class="btn btn-secondary" id="invite-students">+ Invite students</button></div>
    </div>

    <div class="card" style="padding:var(--spacing-5);margin-bottom:var(--spacing-6);">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end;">
        <div class="form-group" style="margin:0;">
          <label class="form-label" for="student-search">Search</label>
          <input class="form-input" id="student-search" placeholder="Name or email...">
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label" for="student-filter">Status</label>
          <select class="form-input form-select" id="student-filter">
            <option value="">All statuses</option>
            <option value="active">Active</option>
            <option value="warning">Attention</option>
            <option value="suspended">Suspended</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;">
          <label class="form-label" for="student-program">Program</label>
          <select class="form-input form-select" id="student-program">
            <option value="">All programs</option>
            <option value="B.Tech CSE">B.Tech CSE</option>
            <option value="B.Tech IT">B.Tech IT</option>
            <option value="MCA">MCA</option>
            <option value="M.Tech">M.Tech</option>
          </select>
        </div>
      </div>
    </div>

    <section class="card">
      <div class="card-header flex items-center justify-between" style="flex-wrap:wrap;gap:12px;">
        <div><h2 class="card-title">Enrolled students</h2><p class="card-subtitle" id="student-count"></p></div>
        <div class="btn-group" role="group" aria-label="Table view">
          <button class="btn btn-sm btn-primary" data-view="table">Table</button>
        </div>
      </div>
      <div class="card-body" style="padding-top:var(--spacing-4);padding-bottom:0;">
        <div class="table-wrapper" style="border:none;border-radius:0;">
          <table class="table">
            <thead><tr><th>Student</th><th>Program</th><th>Year</th><th>Courses</th><th>Attendance</th><th>GPA</th><th>Status</th><th></th></tr></thead>
            <tbody id="student-body"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>
  <script src="../../js/pages/admin/students.js"></script>
</body>
</html>
