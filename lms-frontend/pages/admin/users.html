<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="admin" data-page="admin-users" data-title="Users">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">

    <div class="page-header">
      <div class="page-title-section"><h1>Users</h1><p>Search every account, change roles and suspend access.</p></div>
    </div>

    <div class="card" style="padding:var(--spacing-5);margin-bottom:var(--spacing-6);">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end;">
        <div class="form-group" style="margin:0;"><label class="form-label" for="user-search">Search</label>
          <input class="form-input" id="user-search" placeholder="Name or email..."></div>
        <div class="form-group" style="margin:0;"><label class="form-label" for="user-role">Role</label>
          <select class="form-input form-select" id="user-role">
            <option value="">All roles</option>
            <option value="student">Student</option>
            <option value="faculty">Faculty</option>
            <option value="admin">Admin</option>
          </select></div>
        <div class="form-group" style="margin:0;"><label class="form-label" for="user-status">Status</label>
          <select class="form-input form-select" id="user-status">
            <option value="">All statuses</option>
            <option value="active">Active</option>
            <option value="warning">Attention</option>
            <option value="suspended">Suspended</option>
          </select></div>
      </div>
    </div>

    <section class="card">
      <div class="card-header"><h2 class="card-title">All accounts</h2><p class="card-subtitle" id="user-count"></p></div>
      <div class="card-body" style="padding-top:var(--spacing-4);padding-bottom:0;">
        <div class="table-wrapper" style="border:none;border-radius:0;">
          <table class="table">
            <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last active</th><th></th></tr></thead>
            <tbody id="user-body"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>
  <script src="../../js/pages/admin/users.js"></script>
</body>
</html>
