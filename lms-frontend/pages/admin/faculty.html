<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faculty - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="admin" data-page="admin-faculty" data-title="Faculty">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">

    <div class="page-header">
      <div class="page-title-section"><h1>Faculty</h1><p>Manage instructor accounts and roles.</p></div>
    </div>

    <div class="card" style="padding:var(--spacing-5);margin-bottom:var(--spacing-6);">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end;">
        <div class="form-group" style="margin:0;"><label class="form-label" for="fac-search">Search</label>
          <input class="form-input" id="fac-search" placeholder="Name or email..."></div>
        <div class="form-group" style="margin:0;"><label class="form-label" for="fac-dept">Department</label>
          <select class="form-input form-select" id="fac-dept">
            <option value="">All departments</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Information Technology">Information Technology</option>
          </select></div>
      </div>
    </div>

    <section class="card">
      <div class="card-header"><h2 class="card-title">Faculty members</h2><p class="card-subtitle" id="fac-count"></p></div>
      <div class="card-body" style="padding-top:var(--spacing-4);padding-bottom:0;">
        <div class="table-wrapper" style="border:none;border-radius:0;">
          <table class="table">
            <thead><tr><th>Instructor</th><th>Department</th><th>Title</th><th>Courses</th><th>Students</th><th>Joined</th><th>Status</th><th></th></tr></thead>
            <tbody id="fac-body"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>
  <script src="../../js/pages/admin/faculty.js"></script>
</body>
</html>
