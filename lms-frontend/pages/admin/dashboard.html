<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="admin" data-page="admin-dashboard" data-title="Dashboard">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">

    <div id="admin-welcome"></div>

    <div class="grid grid-cols-4" id="admin-stats" style="gap:var(--spacing-6);margin-bottom:var(--spacing-6);"></div>

    <div class="dash-col">
      <div class="stack">
        <section class="card">
          <div class="card-header"><h2 class="card-title">System activity</h2><p class="card-subtitle">Recent platform events</p></div>
          <div class="card-body" style="padding-top:var(--spacing-4);padding-bottom:var(--spacing-4);" id="system-activity"></div>
        </section>
        <section class="card">
          <div class="card-header flex items-center justify-between" style="flex-wrap:wrap;gap:12px;">
            <div><h2 class="card-title">Active users</h2><p class="card-subtitle">Last 6 months</p></div>
            <a class="btn btn-sm btn-ghost" href="reports.html">Open reports</a>
          </div>
          <div class="card-body" style="padding-top:var(--spacing-4);" id="active-chart"></div>
        </section>
      </div>

      <section class="card">
        <div class="card-header flex items-center justify-between" style="flex-wrap:wrap;gap:12px;">
          <div><h2 class="card-title">Recent users</h2><p class="card-subtitle">Latest registrations and accounts</p></div>
          <a class="btn btn-sm btn-ghost" href="users.html">Manage users</a>
        </div>
        <div class="card-body" style="padding-top:var(--spacing-4);padding-bottom:0;">
          <div class="table-wrapper" style="border:none;border-radius:0;">
            <table class="table">
              <thead><tr><th>User</th><th>Role</th><th>Status</th><th>Last active</th></tr></thead>
              <tbody id="user-table-body"></tbody>
            </table>
          </div>
        </div>
      </section>
    </div>

  </main>
  <script src="../../js/pages/admin/dashboard.js"></script>
</body>
</html>
