<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/design-system.css">
  <link rel="stylesheet" href="../../css/antigravity.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="admin" data-page="admin-notifications" data-title="Notifications">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">

    <div class="page-header">
      <div class="page-title-section"><h1>Notifications</h1><p>Platform updates and broadcasts to every user.</p></div>
      <div class="page-actions">
        <button class="btn btn-secondary" id="mark-all-read-btn">Mark all as read</button>
      </div>
    </div>

    <section class="card" style="margin-bottom:var(--spacing-6);">
      <div class="card-header">
        <div>
          <h2 class="card-title">Send broadcast</h2>
          <p class="card-subtitle">Delivered to every student, faculty member and admin as a system notification</p>
        </div>
      </div>
      <div class="card-body">
        <div class="form-group">
          <label class="form-label" for="broadcast-title">Title</label>
          <input class="form-input" id="broadcast-title" type="text" maxlength="250" placeholder="e.g. Holiday on Friday">
        </div>
        <div class="form-group">
          <label class="form-label" for="broadcast-message">Message</label>
          <textarea class="form-input form-textarea" id="broadcast-message" maxlength="2000" placeholder="Write the announcement..."></textarea>
        </div>
        <div style="display:flex;justify-content:flex-end;">
          <button class="btn btn-primary" id="broadcast-send-btn">Send to everyone</button>
        </div>
      </div>
    </section>

    <div class="tabs" role="tablist" aria-label="Notification filters">
      <button class="tab active" data-nfilter="all">All</button>
      <button class="tab" data-nfilter="unread">Unread</button>
      <button class="tab" data-nfilter="system">System</button>
    </div>

    <div id="notif-list" class="stack"></div>

  </main>
  <script src="../../js/pages/admin/notifications.js"></script>
</body>
</html>
