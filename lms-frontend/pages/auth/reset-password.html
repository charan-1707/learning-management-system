<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a new password - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/auth.css">
  <link rel="stylesheet" href="../../css/design-system.css">
  <link rel="stylesheet" href="../../css/antigravity.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-page="reset-password" style="background:var(--color-bg-primary);">

  <button class="auth-theme-toggle" id="auth-theme-toggle" aria-label="Toggle night mode" title="Toggle night mode">
    <span id="theme-toggle-icon"></span>
  </button>

  <div class="auth-body">
    <aside class="auth-aside">
      <div class="auth-aside-top">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--color-primary)"/>
          <path d="M9 23V9l14 6-14 8z" fill="#fff"/>
        </svg>
        <span class="auth-aside-brand">LearnHub</span>
      </div>

      <div class="auth-aside-quote">
        <h2>Almost there.</h2>
        <p>Choose a new password and you will be back in your courses in seconds.</p>
      </div>

      <div style="font-size:12px;color:var(--color-text-muted);">LearnHub &middot; Spring 2026 Semester</div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-logo-mobile">
          <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--color-primary)"/>
            <path d="M9 23V9l14 6-14 8z" fill="#fff"/>
          </svg>
          LearnHub
        </div>

        <h1 class="auth-heading">Choose a new password</h1>
        <p class="auth-subheading">Your reset link works once and expires after 15 minutes.</p>

        <form id="reset-form" novalidate>
          <div class="auth-field">
            <label class="form-label" for="reset-password">New password (min 4 characters)</label>
            <div class="auth-input-wrap">
              <input class="auth-input" type="password" id="reset-password" name="password" placeholder="New password" autocomplete="new-password" required>
            </div>
            <div class="auth-error-text" data-error-for="password"></div>
          </div>

          <div class="auth-field">
            <label class="form-label" for="reset-confirm">Confirm new password</label>
            <div class="auth-input-wrap">
              <input class="auth-input" type="password" id="reset-confirm" name="confirm" placeholder="Confirm password" autocomplete="new-password" required>
            </div>
            <div class="auth-error-text" data-error-for="confirm"></div>
          </div>

          <button type="submit" class="auth-submit" id="reset-btn">Set new password</button>

          <div class="auth-error-text" id="reset-error" style="text-align:center;margin-top:12px;"></div>
          <div id="reset-success" style="display:none;text-align:center;margin-top:12px;font-size:13px;"></div>
        </form>

        <div class="auth-footer">
          <a href="login.html">Back to sign in</a>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/pages/auth/reset-password.js"></script>
</body>
</html>
