<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forgot password - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/auth.css">
  <link rel="stylesheet" href="../../css/design-system.css">
  <link rel="stylesheet" href="../../css/antigravity.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-page="forgot-password" style="background:var(--color-bg-primary);">

  <button class="auth-theme-toggle" id="auth-theme-toggle" aria-label="Toggle night mode" title="Toggle night mode">
    <span id="theme-toggle-icon"></span>
  </button>

  <div class="auth-body">
    <aside class="auth-aside">
      <div class="auth-aside-top">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--color-primary)"/>
          <path d="M9 23V9l14 6-14 8z" fill="#fff"/>
        </svg>
        <span class="auth-aside-brand">LearnHub</span>
      </div>

      <div class="auth-aside-quote">
        <h2>Locked out?<br>No problem.</h2>
        <p>Enter your account email and we will send you a reset link that stays valid for 15 minutes.</p>
      </div>

      <div style="font-size:12px;color:var(--color-text-muted);">LearnHub &middot; Spring 2026 Semester</div>
    </aside>

    <main class="auth-main">
      <div class="auth-card">
        <div class="auth-logo-mobile">
          <svg width="30" height="30" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <rect x="1" y="1" width="30" height="30" rx="8" fill="var(--color-primary)"/>
            <path d="M9 23V9l14 6-14 8z" fill="#fff"/>
          </svg>
          LearnHub
        </div>

        <h1 class="auth-heading">Reset your password</h1>
        <p class="auth-subheading">We will email you a one-time link to choose a new password.</p>

        <form id="forgot-form" novalidate>
          <div class="auth-field">
            <label class="form-label" for="forgot-email">Email address</label>
            <div class="auth-input-wrap">
              <input class="auth-input" type="email" id="forgot-email" name="email" placeholder="Email" autocomplete="email" required>
            </div>
            <div class="auth-error-text" data-error-for="email"></div>
          </div>

          <button type="submit" class="auth-submit" id="forgot-btn">Send reset link</button>

          <div class="auth-error-text" id="forgot-error" style="text-align:center;margin-top:12px;"></div>
          <div id="forgot-success" style="display:none;text-align:center;margin-top:12px;font-size:13px;color:var(--color-success);"></div>
        </form>

        <div class="auth-footer">
          Remembered it? <a href="login.html">Back to sign in</a>
        </div>
      </div>
    </main>
  </div>

  <script src="../../js/pages/auth/forgot-password.js"></script>
</body>
</html>
