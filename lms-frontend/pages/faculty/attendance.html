<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/design-system.css">
  <link rel="stylesheet" href="../../css/antigravity.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="faculty" data-page="faculty-attendance" data-title="Attendance">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">

    <div class="page-header">
      <div class="page-title-section"><h1>Attendance</h1><p>Take attendance for a session and review class averages.</p></div>
    </div>

    <div class="card" style="padding:var(--spacing-5);margin-bottom:var(--spacing-6);">
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;align-items:end;">
        <div class="form-group" style="margin:0;"><label class="form-label" for="att-course">Course</label>
          <select class="form-input form-select" id="att-course"></select></div>
        <div class="form-group" style="margin:0;"><label class="form-label">Selected day</label>
          <div class="form-input" id="att-day-label" style="display:flex;align-items:center;">—</div></div>
        <button class="btn btn-primary" id="mark-attendance" style="height:42px;">Mark attendance</button>
      </div>
    </div>

    <section class="card" id="att-calendar-card" style="margin-bottom:var(--spacing-6);display:none;">
      <div class="card-header" style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
        <div><h2 class="card-title" id="att-cal-title">Month</h2><p class="card-subtitle" id="att-cal-sub">Pick a day to take or review attendance</p></div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-sm btn-secondary" id="att-prev">← Prev</button>
          <button class="btn btn-sm btn-secondary" id="att-today">Today</button>
          <button class="btn btn-sm btn-secondary" id="att-next">Next →</button>
        </div>
      </div>
      <div class="card-body"><div id="att-calendar"></div></div>
    </section>

    <div class="dash-col">
      <section class="card">
        <div class="card-header"><h2 class="card-title" id="roster-title">Day roster</h2><p class="card-subtitle" id="roster-sub">Toggle each student&rsquo;s status, then Mark attendance</p></div>
        <div class="card-body" style="padding-top:var(--spacing-4);padding-bottom:0;">
          <div class="table-wrapper" style="border:none;border-radius:0;">
            <table class="table">
              <thead><tr><th>Student</th><th>Attendance so far</th><th>Status</th></tr></thead>
              <tbody id="roster-body"></tbody>
            </table>
          </div>
        </div>
      </section>

      <div class="stack">
        <section class="card">
          <div class="card-header"><h2 class="card-title">Class averages</h2></div>
          <div class="card-body" id="avg-list"></div>
        </section>
      </div>
    </div>

  </main>
  <script src="../../js/pages/faculty/attendance.js"></script>
</body>
</html>
