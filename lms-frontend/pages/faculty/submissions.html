<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submissions - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="faculty" data-page="faculty-submissions" data-title="Submissions">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">

    <div class="page-header">
      <div class="page-title-section"><h1>Submissions</h1><p>Review and grade student work.</p></div>
    </div>

    <div class="tabs" role="tablist" aria-label="Submission filters">
      <button class="tab active" data-sfilter="all">All</button>
      <button class="tab" data-sfilter="pending">Pending</button>
      <button class="tab" data-sfilter="graded">Graded</button>
    </div>

    <section class="card">
      <div class="card-body" style="padding-top:var(--spacing-4);padding-bottom:0;">
        <div class="table-wrapper" style="border:none;border-radius:0;">
          <table class="table" id="submission-table">
            <thead><tr><th>Student</th><th>Assignment</th><th>Score</th><th>Submitted</th><th>Status</th><th></th></tr></thead>
            <tbody id="submission-body"></tbody>
          </table>
        </div>
      </div>
    </section>

  </main>
  <script src="../../js/pages/faculty/submissions.js"></script>
</body>
</html>
