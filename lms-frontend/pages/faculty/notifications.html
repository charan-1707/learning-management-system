<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications - LearnHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <link rel="stylesheet" href="../../css/design-system.css">
  <link rel="stylesheet" href="../../css/antigravity.css">
  <script src="../../js/boot.js"></script>
</head>
<body data-role="faculty" data-page="faculty-notifications" data-title="Notifications">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay"></div>
  <header class="header" id="header"></header>
  <main class="main" id="main">

    <div class="page-header">
      <div class="page-title-section"><h1>Notifications</h1><p>Submissions, enrollments and updates on your courses.</p></div>
      <div class="page-actions">
        <button class="btn btn-secondary" id="mark-all-read-btn">Mark all as read</button>
      </div>
    </div>

    <div class="tabs" role="tablist" aria-label="Notification filters">
      <button class="tab active" data-nfilter="all">All</button>
      <button class="tab" data-nfilter="unread">Unread</button>
      <button class="tab" data-nfilter="course">Course</button>
      <button class="tab" data-nfilter="assignment">Assignments</button>
      <button class="tab" data-nfilter="quiz">Quizzes</button>
      <button class="tab" data-nfilter="grade">Grades</button>
      <button class="tab" data-nfilter="system">System</button>
    </div>

    <div id="notif-list" class="stack"></div>

  </main>
  <script src="../../js/pages/faculty/notifications.js"></script>
</body>
</html>
